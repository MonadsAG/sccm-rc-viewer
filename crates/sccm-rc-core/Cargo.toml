[package]
name = "sccm-rc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "High-level SCCM RC session: connect, render-stream, input, lifecycle"

[[bin]]
name = "rdp-connect-test"
path = "src/bin/rdp-connect-test.rs"

[dependencies]
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
bytes.workspace = true
clap.workspace = true
sccm-rc-protocol.workspace = true
sccm-rc-orders.workspace = true
ironrdp-connector = "0.8"
ironrdp-pdu = "0.7"
ironrdp-core = "0.1"
ironrdp-session = "0.8"
ironrdp-graphics = "0.7"
ironrdp-svc = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Windows OS-clipboard access for clipboard sharing (cliprdr) — text path
# uses the high-level helpers here; the file path (CF_HDROP) below uses the
# `windows` crate directly since clipboard-win doesn't expose it cleanly.

# Raw Win32 for CF_HDROP reading (paste-file-from-Explorer → remote), plus the
# OS clipboard text path.
[target.'cfg(windows)'.dependencies]
windows.workspace = true
clipboard-win = "5"

# Text-only OS clipboard on non-Windows hosts (no image support needed).
[target.'cfg(not(windows))'.dependencies]
arboard = { version = "3", default-features = false }

# Login Keychain access (saved logon passwords) on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
