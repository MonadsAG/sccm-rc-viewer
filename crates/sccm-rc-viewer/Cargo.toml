[package]
name = "sccm-rc-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "SCCM Remote Control viewer UI (winit + softbuffer)"

[[bin]]
name = "sccm-rc-viewer"
path = "src/main.rs"

[dependencies]
sccm-rc-core.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap.workspace = true
# Rolling-file log appender so bug reports can attach the viewer's own
# tracing output (the most diagnostic-rich part of a report).
tracing-appender = "0.2"
winit = "0.30"
softbuffer = "0.4"
# Tiny embedded 8x8 bitmap font — fallback when no system TTF is found.
font8x8 = "0.3"
# Anti-aliased proportional text (loads a Windows system font at runtime).
ab_glyph = "0.2"
# PNG encoding for session recording.
image = { version = "0.25", default-features = false, features = ["png"] }
# GPU rendering (optional path; softbuffer stays as the fallback). wgpu 22 uses
# raw-window-handle 0.6, matching winit 0.30.
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
# Localization (EN/NL/DE) with compile-time embedded YAML catalogs.
rust-i18n = "3"
# Detect the Windows UI language at startup (reads the user locale).
sys-locale = "0.3"

# Low-level keyboard hook (WH_KEYBOARD_LL) for Win-key passthrough in windowed
# mode + MessageBox for the bug-report confirmation dialog. Workspace `windows`
# dep adds the WindowsAndMessaging / KeyboardAndMouse features (see root
# Cargo.toml) so all crates share one compiled instance.
[target.'cfg(windows)'.dependencies]
windows.workspace = true
# Read the OS clipboard for paste-into-connect-field (same crate sccm-rc-core
# uses for cliprdr). Windows-only, like the rest of the viewer's OS glue.
clipboard-win = "5"

# OS clipboard text (paste into the connect / logon fields) on non-Windows.
[target.'cfg(not(windows))'.dependencies]
arboard = { version = "3", default-features = false }

# Dock icon on macOS: a bare binary (no .app bundle) gets the generic icon,
# and winit ignores the window icon there, so the viewer sets it through
# NSApplication at startup. Same objc2 versions arboard already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSView", "NSWindow", "NSToolbar", "NSToolbarItem", "NSMenu", "NSMenuItem", "NSEvent", "NSControl", "NSCell", "NSUserInterfaceItemIdentification", "NSUserInterfaceValidation", "NSGraphics", "NSButton", "NSTextField", "NSSecureTextField", "NSFont", "NSColor", "NSText", "NSTextContent", "NSButtonCell", "NSActionCell", "NSTextFieldCell", "block2", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSArray", "NSObject", "NSGeometry", "NSNotification"] }
security-framework = "3.7"
