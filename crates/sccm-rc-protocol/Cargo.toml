[package]
name = "sccm-rc-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "SCCM Remote Control 2701-wire protocol: SSPI handshake, SecFilter framing, session arbitration"

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
bytes.workspace = true
byteorder.workspace = true
socket2.workspace = true
clap.workspace = true

# Native SSPI on Windows (SSO via the current user's Kerberos/NTLM identity).
[target.'cfg(windows)'.dependencies]
windows.workspace = true

# Pure-Rust Negotiate/NTLM everywhere else (explicit DOMAIN\user + password).
# Same version the vendored ironrdp-connector already resolves.
[target.'cfg(not(windows))'.dependencies]
sspi = "0.18"

[[bin]]
name = "handshake-test"
path = "src/bin/handshake-test.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "pcap-extract"
path = "src/bin/pcap-extract.rs"

[[bin]]
name = "data-phase-test"
path = "src/bin/data-phase-test.rs"

[[bin]]
name = "rdp-explore"
path = "src/bin/rdp-explore.rs"
