name: Publish to ghcr.io (update feed)

# Publishing a release (Releases → Edit → Publish) pushes its macOS .dmg to
# the GitHub Container Registry, where the viewer's auto-update looks for it:
#
#   ghcr.io/<owner>/<repo>:<label>   e.g. :0.9.13-m1
#   ghcr.io/<owner>/<repo>:latest    moved only to a newer label (or its rebuild)
#
# The artifact is an OCI manifest with one layer (the .dmg) and the
# annotations the viewer reads (src/update/registry.rs): release label,
# CFBundleVersion, release URL and release notes. The viewer itself checks
# signature, team and notarization before installing anything.
#
# Needs the release.json asset written by release-macos.yml (label, build,
# sha256). Releases built before it existed: rebuild the tag first
# (RELEASING.md). After the very first push, make the package public once:
# Packages → sccm-rc-viewer → Package settings → Change visibility.
#
# Withdraw a release: point `latest` back at the previous label, e.g.
#   oras tag ghcr.io/monadsag/sccm-rc-viewer:0.9.13-m1 latest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.9.13-m1)"
        required: true

permissions:
  contents: read # download the release assets
  packages: write # push to ghcr.io

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download the .dmg and release.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::not a release tag: $TAG"; exit 1 ;;
          esac
          case "$TAG" in
            *[!0-9A-Za-z.v-]*) echo "::error::unexpected characters in $TAG"; exit 1 ;;
          esac
          mkdir dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern '*-macos-universal.dmg' --pattern release.json
          ls -l dl

      - name: Check the assets against release.json
        id: meta
        working-directory: dl
        run: |
          LABEL="$(jq -r .label release.json)"
          BUILD="$(jq -r .build release.json)"
          FILE="$(jq -r .file release.json)"
          SHA="$(jq -r .sha256 release.json)"
          [ "$LABEL" = "${TAG#v}" ] || { echo "::error::release.json is for $LABEL, not ${TAG#v}"; exit 1; }
          case "$BUILD" in ''|*[!0-9]*) echo "::error::build is not a number: $BUILD"; exit 1 ;; esac
          [ -f "$FILE" ] || { echo "::error::$FILE missing"; exit 1; }
          echo "$SHA  $FILE" | sha256sum -c -
          {
            echo "label=$LABEL"
            echo "build=$BUILD"
            echo "file=$FILE"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: oras-project/setup-oras@v1

      - name: Push to ghcr.io
        working-directory: dl
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          LABEL: ${{ steps.meta.outputs.label }}
          BUILD: ${{ steps.meta.outputs.build }}
          FILE: ${{ steps.meta.outputs.file }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes as published (edits to the draft included), shown
          # in the viewer's update sheet: without the changelog link, at
          # most 8000 bytes.
          NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' \
            | tr -d '\r' | grep -v '^\*\*Full Changelog\*\*' || true)"
          if [ "${#NOTES}" -gt 8000 ]; then
            NOTES="$(printf '%s' "$NOTES" | head -c 7990 | iconv -c -f UTF-8 -t UTF-8)…"
          fi
          # Annotations as a file: --annotation cannot carry line breaks.
          jq -n \
            --arg label "$LABEL" --arg build "$BUILD" --arg notes "$NOTES" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --arg src "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{"$manifest": {
                "org.opencontainers.image.version": $label,
                "ch.monads.sccm-rc.build": $build,
                "ch.monads.sccm-rc.release-url": $url,
                "ch.monads.sccm-rc.notes": $notes,
                "org.opencontainers.image.source": $src,
                "org.opencontainers.image.created": $created}}' > "$RUNNER_TEMP/annotations.json"

          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          oras push "$IMAGE:$LABEL" \
            --artifact-type application/vnd.monads.sccm-rc.dmg \
            --annotation-file "$RUNNER_TEMP/annotations.json" \
            "$FILE:application/x-apple-diskimage"

          # Move `latest` only forward, by release label (version order:
          # 0.9.13 < 0.9.13-m1 < 0.9.13-m2 < 0.9.14), or to a rebuild of the
          # same label. Not by build number: rebuilding an old tag gives it
          # the newest run number, and viewers would install it as an update.
          CURRENT="$(oras manifest fetch "$IMAGE:latest" 2>/dev/null \
            | jq -r '.annotations["org.opencontainers.image.version"] // ""' || true)"
          NEWEST="$(printf '%s\n%s\n' "$CURRENT" "$LABEL" | sed '/^$/d' | sort -V | tail -n1)"
          if [ -z "$CURRENT" ] || [ "$NEWEST" = "$LABEL" ]; then
            oras tag "$IMAGE:$LABEL" latest
            echo "latest → $LABEL (build $BUILD)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "latest stays at $CURRENT ($LABEL is older)" >> "$GITHUB_STEP_SUMMARY"
          fi
          oras logout ghcr.io
