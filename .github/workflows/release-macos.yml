name: Release (macOS)

# Builds the universal macOS .dmg for a release and attaches it to the GitHub
# release of the tag. Signing and notarization are OPTIONAL: without the
# secrets below the .dmg is still built, ad-hoc signed (Gatekeeper will block
# it after download; see README → macOS).
#
# Secrets (store them in the `release` environment, not as repository secrets,
# and give that environment required reviewers so a tag alone cannot use them):
#   MACOS_CERT_P12_BASE64   Developer ID Application certificate + key (.p12), base64
#   MACOS_CERT_PASSWORD     password of that .p12
#   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: Example Org (TEAMID1234)"
#   MACOS_NOTARY_KEY_BASE64 App Store Connect API key (.p8), base64
#   MACOS_NOTARY_KEY_ID     its key ID
#   MACOS_NOTARY_ISSUER     its issuer ID
#
# Repository variable (optional): MACOS_BUNDLE_ID, for distributions that ship
# under their own bundle identifier.
#
# Tags: v<crate version> (e.g. v0.9.13), or with a suffix for downstream
# rebuilds of the same upstream version (e.g. v0.9.13-m1, v0.9.13-m2). The tag
# must start with the version in Cargo.toml, otherwise the run fails. Tags
# with a suffix are released as pre-releases. The release is created as a
# draft; publish it by hand after checking the .dmg.
#
# This workflow never runs for pull requests, so code from forks cannot reach
# the secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # attach the .dmg to the release

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.MACOS_NOTARY_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust + both macOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check the tag against the crate version
        id: version
        run: |
          PKGID="$(cargo pkgid -p sccm-rc-viewer)"
          VERSION="${PKGID##*[#@]}"
          LABEL="$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            LABEL="${GITHUB_REF_NAME#v}"
            case "$LABEL" in
              "$VERSION"|"$VERSION"-*) ;;
              *) echo "::error::tag $GITHUB_REF_NAME does not match crate version $VERSION"; exit 1 ;;
            esac
            case "$LABEL" in
              *[!0-9A-Za-z.-]*) echo "::error::tag may only contain letters, digits, dots and dashes"; exit 1 ;;
            esac
          fi
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Release label: $LABEL (crate version $VERSION)"

      - name: Import signing certificate into a temporary keychain
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          umask 077
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Write notarization key
        if: env.HAS_NOTARY == 'true'
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "MACOS_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Bundle, sign, notarize
        env:
          # Repository variable; unset → the default upstream bundle ID.
          # Downstream distributions set their own (e.g. ch.example.sccm-rc-viewer).
          MACOS_BUNDLE_ID: ${{ vars.MACOS_BUNDLE_ID }}
          MACOS_BUILD_NUMBER: ${{ github.run_number }}
          MACOS_DMG_LABEL: ${{ steps.version.outputs.label }}
          MACOS_SIGN_IDENTITY: ${{ env.HAS_CERT == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: packaging/macos/bundle.sh --universal --dmg

      - uses: actions/upload-artifact@v6
        with:
          name: sccm-rc-macos
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft $PRE \
                 --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber

      - name: Remove keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
